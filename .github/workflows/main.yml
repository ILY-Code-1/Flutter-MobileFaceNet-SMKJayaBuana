name: "CI/CD"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ============================================================
  # JOB 1 — Build Android (APK + AAB)
  # ============================================================
  build_android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Build appBundle
        run: flutter build appbundle

      - name: Stage Android Artifacts
        run: |
          mkdir -p staging
          cp build/app/outputs/flutter-apk/app-release.apk staging/
          cp build/app/outputs/bundle/release/app-release.aab staging/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: staging/
          if-no-files-found: error

  # ============================================================
  # JOB 2 — Build iOS (IPA, no codesign)
  # ============================================================
  build_ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Update CocoaPods
        run: sudo gem install cocoapods

      - name: Ensure iOS platform 15.5 in Podfile
        run: |
          sed -i '' "s/^#* *platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          echo "----- ios/Podfile (head) -----"
          head -5 ios/Podfile

      - name: Pod Install
        working-directory: ios
        timeout-minutes: 30
        run: pod install --repo-update

      - name: Build IPA (no codesign)
        timeout-minutes: 45
        run: flutter build ipa --no-codesign

      - name: Compress iOS Build
        run: |
          cd build
          tar -czf ios_build.tar.gz ios

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios_build.tar.gz
          if-no-files-found: error

  # ============================================================
  # JOB 3 — Release (gabungkan semua artifact)
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Downloaded Artifacts
        run: ls -R artifacts

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          version=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          version="${version}-release"
          echo "VERSION=${version}" | tee -a $GITHUB_ENV

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Modify Tag
        if: env.TAG_EXISTS == 'true'
        id: modify_tag
        run: |
          new_version="${{ env.VERSION }}-build-${{ github.run_number }}"
          echo "VERSION=$new_version" >> $GITHUB_ENV

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/android-release/app-release.apk,artifacts/android-release/app-release.aab,artifacts/ios-release/ios_build.tar.gz"
          tag: v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
