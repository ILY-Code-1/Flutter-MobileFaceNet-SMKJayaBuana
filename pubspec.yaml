name: flutter_absensi_smk_jaya_buana
description: "Face-recognition student attendance app for SMK Jaya Buana."
publish_to: 'none'

version: 2.0.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Camera & images
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0

  # ML
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.11.0

  # Audio / device / misc
  audioplayers: ^6.1.0
  device_info_plus: ^10.1.2
  crypto: ^3.0.3
  intl: ^0.19.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^10.1.4

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/models/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#FBF8F1"
  adaptive_icon_foreground: "assets/images/logo.png"
  # Extra padding so the full logo (incl. the "JAYA BUANA" text) stays
  # inside the adaptive-icon safe zone and is not clipped by the launcher
  # mask (circle / squircle / rounded square).
  adaptive_icon_foreground_inset: 25
